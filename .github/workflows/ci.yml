name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff — format check
        run: ruff format --check src/ tests/ eval/ scripts/

      - name: Ruff — lint
        run: ruff check src/ tests/ eval/ scripts/

      - name: Mypy — strict type checking
        run: mypy src/

      - name: Pytest — unit and integration tests
        run: pytest tests/ -v --tb=short

  smoke-eval:
    name: Smoke eval (10 dev answers, needs NEBIUS_API_KEY secret)
    runs-on: ubuntu-latest
    needs: test
    env:
      HAS_KEY: ${{ secrets.NEBIUS_API_KEY != '' }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_KEY == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        run: pip install -e ".[dev]"
      - name: Re-judge 10 dev answers
        if: env.HAS_KEY == 'true'
        run: python eval/smoke_eval.py
      - name: Skipped (no NEBIUS_API_KEY secret)
        if: env.HAS_KEY != 'true'
        run: echo "NEBIUS_API_KEY secret not set - smoke eval skipped."

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t citewise:ci .
