[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citewise"
version = "0.1.0"
description = "UK government guidance, answered with citations."
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.34",
    # Data models and config
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # HTTP client
    "httpx>=0.27,<0.29",
    # HTML parsing
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.3,<6",
    # Vector DB
    "qdrant-client>=1.12,<2",
    # Embeddings (dense + sparse BM25) — CPU-only
    "fastembed>=0.4,<0.6",
    # LLM routing (Gemini + Nebius)
    "litellm>=1.52,<2",
    # Tracing (optional — only used when keys are set)
    "langfuse>=2.0,<3",
    # Token counting
    "tiktoken>=0.8,<1",
    # Utilities
    "python-dotenv>=1.0,<2",
    "tenacity>=9.0,<10",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-httpx>=0.32,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "types-beautifulsoup4",
    "types-tqdm",
    "httpx",          # already in main, explicit for tests
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["fastembed.*", "litellm.*", "langfuse.*", "qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires running Qdrant and network access",
    "slow: takes more than 10 seconds",
]
