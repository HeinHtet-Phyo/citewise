<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citewise — UK Government Guidance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "GDS Transport", Arial, sans-serif;
      background: #f3f2f1;
      color: #0b0c0c;
      min-height: 100vh;
    }

    header {
      background: #1d70b8;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .crown { color: #fff; font-size: 22px; font-weight: bold; letter-spacing: -1px; }
    header h1 { color: #fff; font-size: 18px; font-weight: bold; }
    header p { color: #d4e8f9; font-size: 13px; margin-top: 2px; }

    main {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .search-box {
      background: #fff;
      border: 2px solid #0b0c0c;
      padding: 20px;
      margin-bottom: 24px;
    }
    .search-box label {
      display: block;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .search-box .hint {
      color: #505a5f;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      font-size: 15px;
      padding: 8px 10px;
      border: 2px solid #0b0c0c;
      outline: none;
    }
    input[type="text"]:focus { border-color: #fd0; box-shadow: inset 0 0 0 2px #0b0c0c; }

    button {
      background: #00703c;
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: bold;
      padding: 8px 20px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #005a30; }
    button:disabled { background: #b1b4b6; cursor: default; }

    .answer-card {
      background: #fff;
      border-left: 4px solid #1d70b8;
      padding: 20px;
      margin-bottom: 20px;
    }
    .answer-text {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .refused-banner {
      background: #fff4e5;
      border-left: 4px solid #f47738;
      padding: 14px 20px;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .meta {
      font-size: 12px;
      color: #505a5f;
      margin-top: 12px;
      display: flex;
      gap: 20px;
    }

    .citations-heading {
      font-size: 14px;
      font-weight: bold;
      color: #505a5f;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .citation {
      border: 1px solid #b1b4b6;
      padding: 14px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .citation-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }
    .citation-n {
      background: #1d70b8;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .citation-title {
      font-weight: bold;
      font-size: 14px;
    }
    .citation-section {
      color: #505a5f;
      font-size: 13px;
    }
    .citation-snippet {
      font-size: 13px;
      color: #0b0c0c;
      line-height: 1.5;
      margin-top: 4px;
    }
    .citation-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: #1d70b8;
      text-decoration: none;
    }
    .citation-link:hover { text-decoration: underline; }
    .citation-updated {
      font-size: 11px;
      color: #505a5f;
      margin-top: 4px;
    }

    .spinner {
      display: none;
      text-align: center;
      padding: 32px;
      color: #505a5f;
      font-size: 15px;
    }
    .spinner.visible { display: block; }

    .error-banner {
      display: none;
      background: #fef2f2;
      border-left: 4px solid #d4351c;
      padding: 14px 20px;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .error-banner.visible { display: block; }

    @media (max-width: 600px) {
      .input-row { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="crown">GOV.UK</div>
  </div>
  <div>
    <h1>Citewise</h1>
    <p>UK government guidance, answered with citations.</p>
  </div>
</header>

<main>
  <div class="search-box">
    <label for="question">Ask a question about UK government guidance</label>
    <p class="hint">Benefits, employment rights, housing, driving — answers sourced from GOV.UK.</p>
    <div class="input-row">
      <input type="text" id="question" placeholder="e.g. Am I entitled to Statutory Sick Pay?" autocomplete="off">
      <button id="askBtn" onclick="ask()">Ask</button>
    </div>
  </div>

  <div class="spinner" id="spinner">Searching GOV.UK guidance…</div>
  <div class="error-banner" id="errorBanner"></div>
  <div id="result"></div>
</main>

<script>
  const questionInput = document.getElementById("question");
  const askBtn = document.getElementById("askBtn");
  const spinner = document.getElementById("spinner");
  const errorBanner = document.getElementById("errorBanner");
  const resultDiv = document.getElementById("result");

  questionInput.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

  async function ask() {
    const question = questionInput.value.trim();
    if (!question) return;

    askBtn.disabled = true;
    spinner.classList.add("visible");
    errorBanner.classList.remove("visible");
    resultDiv.innerHTML = "";

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, config_name: "hybrid_400_rerank" }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || "Request failed");
      }

      const data = await res.json();
      renderAnswer(data);

    } catch (err) {
      errorBanner.textContent = "Error: " + err.message;
      errorBanner.classList.add("visible");
    } finally {
      askBtn.disabled = false;
      spinner.classList.remove("visible");
    }
  }

  function renderAnswer(data) {
    if (data.refused) {
      resultDiv.innerHTML = `
        <div class="refused-banner">
          <strong>No answer found.</strong>
          ${data.refusal_reason === "low_evidence"
            ? " The guidance does not contain enough information to answer this question reliably."
            : data.refusal_reason === "unsafe"
            ? " This question cannot be answered by this service."
            : " This question is outside the scope of UK government guidance."}
        </div>`;
      return;
    }

    const metaHtml = `
      <div class="meta">
        <span>⏱ ${data.latency_ms} ms</span>
        <span>📄 ${data.citations.length} source${data.citations.length !== 1 ? "s" : ""}</span>
        <span>💰 £${data.cost_gbp.toFixed(5)}</span>
      </div>`;

    const citationsHtml = data.citations.map(c => `
      <div class="citation">
        <div class="citation-header">
          <span class="citation-n">${c.n}</span>
          <div>
            <div class="citation-title">${escHtml(c.title)}</div>
            ${c.section ? `<div class="citation-section">${escHtml(c.section)}</div>` : ""}
          </div>
        </div>
        <div class="citation-snippet">${escHtml(c.snippet)}</div>
        <a class="citation-link" href="${escHtml(c.url)}" target="_blank" rel="noopener">
          View on GOV.UK ↗
        </a>
        <div class="citation-updated">Last updated: ${escHtml(c.updated_at)}</div>
      </div>`).join("");

    resultDiv.innerHTML = `
      <div class="answer-card">
        <div class="answer-text">${escHtml(data.answer)}</div>
        ${metaHtml}
      </div>
      ${data.citations.length > 0 ? `<div class="citations-heading">Sources</div>${citationsHtml}` : ""}`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>

</body>
</html>
